name: Deploy Gateway Service to Docker Hub

on:
  push:
    branches: [ "main", "master" ]

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build JAR and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: tarassov12346/gateway-service:latest

      # 🔥 НА ТИВНЫЙ АВТОДЕПЛОЙ В КОДС ПЕЙС (ЖЕЛЕЗОБЕТОННЫЙ ВАРИАНТ)
      - name: Trigger Redeploy in GitHub Codespaces
        run: |
          # Находим имя вашего активного Codespace для репозитория полигона PWD-POLYGONE
          CODESPACE_NAME=$(gh cs list --json name,repository --jq '.[] | select(.repository == "tarassov12346/PWD-POLYGONE") | .name' | head -n 1)
          
          if [ -z "$CODESPACE_NAME" ]; then
            echo "⚠️  Активный Codespace для PWD-POLYGONE не найден. Пропускаем деплой."
            exit 0
          fi
          
          echo "🚀 Найден активный Codespace: $CODESPACE_NAME. Отправляем команду обновления..."
          
          # Подключаемся по SSH, переходим в папку полигона, стягиваем новый образ и перезапускаем gateway-service
          gh cs ssh -c "$CODESPACE_NAME" -- "cd /workspaces/PWD-POLYGONE && docker compose pull gateway-service && docker compose up -d gateway-service"
        env:
          GH_TOKEN: ${{ secrets.MICROSERVICES_DEPLOY_TOKEN }}

